# rp1 config for the ELRS telemetry adapter (esc_telemetry_to_battery).
#
# The generic RC/telemetry driver (elrs_driver, from the elrs_ros submodule: RC -> /joy,
# /battery -> handset) is configured by that package's own config/elrs_driver.yaml plus the
# robot-specific serial_port override in rp1_bringup/config/rp1_mvp.yaml. This file only holds
# rp1's ESC telemetry -> BatteryState adapter.

esc_telemetry_to_battery:
  ros__parameters:
    # 'mean' of the ESCs that reported, or one <gpio> name from rp1_drive.urdf.
    battery_source: mean
    publish_rate_hz: 5.0
    esc_names:
      - esc_front_left
      - esc_front_right
      - esc_rear_left
      - esc_rear_right
