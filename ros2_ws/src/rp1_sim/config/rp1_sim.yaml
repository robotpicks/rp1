sim_bridge_node:
  ros__parameters:
    track_width: 0.5        # must match rp1_control's track_width
    max_wheel_speed: 1.0    # must match rp1_control's max_wheel_speed
    wheel_radius: 0.1       # meters, only used to turn wheel speed into a plausible rpm
    update_rate_hz: 50.0
    cmd_timeout_sec: 0.2
    publish_tf: true
    odom_frame_id: odom
    base_frame_id: base_link
