# Robot-specific overrides for the rp1 MVP, layered on top of each package's own defaults
# (ros2_ws/src/*/config/*.yaml). Edit these once real hardware numbers / CAN setup are known;
# everything else should keep working via the package defaults.

teleop_node:
  ros__parameters:
    deadman_button: 4       # button 4: Xbox LB, or the ELRS arm switch -- verify with `ros2 topic echo /joy`

elrs_driver:               # the generic CRSF driver from the elrs_ros submodule
  ros__parameters:
    serial_port: /dev/ttyUSB0  # ELRS receiver's UART (USB adapter, or /dev/ttyAMA0 on a Pi header)
    require_serial: true       # set false to dry-run without the receiver (telemetry logged, no RC)

control_node:
  ros__parameters:
    track_width: 0.5        # meters -- set to the real distance between left/right wheels
    max_wheel_speed: 1.0    # m/s at the wheel that should map to full WheelCommand output

bridge_node:
  ros__parameters:
    can_iface: can0
    dronecan_node_id: 42
    require_can: true       # set false to dry-run the ROS2 pipeline without CAN hardware
