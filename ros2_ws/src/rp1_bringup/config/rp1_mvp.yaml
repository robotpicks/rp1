# Robot-specific overrides for the rp1 MVP, layered on top of each package's own defaults
# (ros2_ws/src/*/config/*.yaml).
#
# The old control_node and bridge_node blocks are gone with those packages. Their settings moved:
#   track width / wheel radius  -> rp1_controllers.yaml (diff_drive_controller's own parameters)
#   cmd_vel timeout             -> rp1_controllers.yaml (diff_drive_controller cmd_vel_timeout)
#   can_iface, node_id          -> rp1_description/urdf/rp1_drive.urdf
#
# That last one is a real constraint rather than a preference: ros2_control reads hardware
# parameters from the <hardware> block of the robot description only, so a CAN interface name
# cannot be overridden from a node parameter file the way bridge_node's could. Change it in the
# URDF. To run with no CAN hardware at all, launch with use_mock:=true, which swaps the plugin
# for mock_components/GenericSystem (this replaced bridge_node's require_can:=false dry run).

teleop_node:
  ros__parameters:
    deadman_button: 4       # button 4: Xbox LB, or the ELRS arm switch -- verify with `ros2 topic echo /joy`

elrs_driver:               # the generic CRSF driver from the elrs_ros submodule
  ros__parameters:
    # Confirmed 2026-08-05: ELRS is its own separate FTDI USB-to-UART device -- not routed
    # through the Waveshare converter that carries IMU/GPS/compass (see rp1_gps.yaml,
    # rp1_imu.yaml, rp1_compass.yaml). Uses the ftdi_sio kernel driver, so it stays on its own
    # /dev/ttyUSB0-style node -- confirmed on the bench that the Waveshare converter's UART1
    # (GPS) instead enumerates as /dev/ttyACM0 (CDC-ACM), so the two don't collide. Not
    # connected yet as of 2026-08-05.
    serial_port: /dev/ttyUSB0  # ELRS receiver's UART, via its own separate FTDI USB device
    require_serial: true       # set false to dry-run without the receiver (telemetry logged, no RC)
