# controller_manager + controller configuration for the rp1 MVP (4 drive wheels, skid-steer).
#
# This replaces the old rp1_control node: the skid-steer kinematics, the command timeout and the
# odometry are all diff_drive_controller's now. Wheel geometry lives here rather than in the
# URDF because diff_drive_controller takes it as its own parameters -- keep these in step with
# rp1_description/urdf/rp1_drive.urdf by hand.
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz -- the rate read()/write() and therefore RPMCommand broadcast run at

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    # Both of these are required, not tuning knobs. rp1's per-ESC voltage/current/temperature is
    # exported from <gpio> blocks, and /dynamic_joint_states is the only topic that can carry it
    # (/joint_states is position/velocity/effort only). Two separate defaults suppress it, both
    # silently -- `ros2 control list_hardware_interfaces` lists all 12 ESC interfaces either way,
    # and rp1_elrs's esc_telemetry_to_battery just never publishes a /battery, so the handset's
    # telemetry goes dead with no error anywhere.
    #
    #   publish_dynamic_joint_states -- defaults false: the topic is not advertised at all.
    #   use_urdf_to_filter           -- defaults true: filters the topic down to interfaces whose
    #                                   prefix is a joint in the URDF, and <gpio> names are not
    #                                   joints, so all four ESC blocks are dropped.
    publish_dynamic_joint_states: true
    use_urdf_to_filter: false

diff_drive_controller:
  ros__parameters:
    # Four wheels, two per side: skid-steer. Names must match the joints in rp1_drive.urdf.
    left_wheel_names:
      - drive_front_left
      - drive_rear_left
    right_wheel_names:
      - drive_front_right
      - drive_rear_right

    # From the CAD (tools/export_urdf_meshes.py in rp1-mechanical), not yet confirmed by
    # mechanical design -- docs/mechanical_request.pdf's §3.1.1/§3.1.2/§3.3.2 tables are still
    # blank. wheel_separation is the track width; wheel_radius here is CAD-nominal, not a
    # measured LOADED rolling radius (§3.3.2 asks for the latter specifically).
    wheel_separation: 1.138612
    wheel_radius: 0.215396

    # The drive VESCs report speed (esc.Status.rpm), not an absolute encoder count -- the wheel
    # position in /joint_states is integrated from that. Odometry must therefore run on the
    # velocity interface, not on integrated position.
    position_feedback: false
    open_loop: false

    enable_odom_tf: true
    odom_frame_id: odom
    base_frame_id: base_link

    # Skid-steer scrubs, so the effective track width is wider than the geometric one. Leave at
    # 1.0 until it is calibrated on the built robot against measured yaw.
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Replaces rp1_control's own cmd_vel staleness watchdog.
    cmd_vel_timeout: 0.5

    publish_limited_velocity: false
    velocity_rolling_window_size: 10

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
